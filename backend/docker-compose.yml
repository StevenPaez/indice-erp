services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indice-erp-app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:cached
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:5173
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=indice_erp
      - DB_USERNAME=indice_erp
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=redis
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SANCTUM_STATEFUL_DOMAINS=localhost:5173,localhost:8000
    networks:
      - indice-network

  nginx:
    image: nginx:alpine
    container_name: indice-erp-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - indice-network

  mysql:
    image: mysql:8.0
    container_name: indice-erp-mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=indice_erp
      - MYSQL_USER=indice_erp
      - MYSQL_PASSWORD=${DB_PASSWORD:-secret}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    ports:
      - "3307:3306"
    networks:
      - indice-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: indice-erp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - indice-network

networks:
  indice-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
